[workspace]
authors = ["Eduardo Farinati <github.com.qazll@simplelogin.fr>"]
channels = ["conda-forge"]
name = "nixfiles"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "just check"
baseline = "just baseline"
hosts = "just hosts"
check-host = "just check-host"
plan = "just plan"
build = "just build"
diff = "just diff"
test-host = "just test-host"
switch = "just switch"
update-inputs = "just update-inputs"
update-flatpak = "just update-flatpak"
provision-identity = "just provision-identity"
remap-keyboard = "just remap-keyboard"
test-input-remapper = "just test-input-remapper"
dotfiles-diff = "just dotfiles-diff"
dotfiles-apply = "just dotfiles-apply"
test-workflows = "just test-workflows"
test-workflows-nix = "just test-workflows-nix"
test-portable-nix = "just test-portable-nix"
test-git = "just test-git"
test-git-nix = "just test-git-nix"
test-terminals = "just test-terminals"
test-terminals-nix = "just test-terminals-nix"
test-yazi-direnv = "just test-yazi-direnv"
test-yazi-direnv-nix = "just test-yazi-direnv-nix"
test-starship-gitui = "just test-starship-gitui"
test-starship-gitui-nix = "just test-starship-gitui-nix"
test-cli-tools = "just test-cli-tools"
test-cli-tools-nix = "just test-cli-tools-nix"
test-desktop-tools = "just test-desktop-tools"
test-desktop-tools-nix = "just test-desktop-tools-nix"

[dependencies]
nix = ">=2.35.3,<3"
just = ">=1.59.0,<2"
bash = ">=5.2.37,<6"
coreutils = ">=9.12,<10"
git = ">=2.56.0,<3"
shellcheck = ">=0.11.0,<0.12"
chezmoi = ">=2.73.0,<3"
jq = ">=1.8.2,<2"
tmux = ">=3.8_,<4"
lua = ">=5.5.0,<6"
python = ">=3.13,<3.14"
pexpect = ">=4.9.0,<5"
pyte = ">=0.8.2,<0.9"
